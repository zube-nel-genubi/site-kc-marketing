server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;
  gzip_min_length 1024;

  # Arquivos com hash no nome: cache longo
  location /_astro/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location ~* \.(woff2?|svg|png|jpe?g|webp|avif|ico)$ { expires 30d; add_header Cache-Control "public"; }

  location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }

  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy strict-origin-when-cross-origin;
}
